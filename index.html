    <meta property="og:description" content="Comprehensive management portal for telecommunications companies, featuring quotation generation, financial tracking, invoice management with attachments, and service scheduling.">

    <!-- PWA & Iconos -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <style>
        
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            margin: 0;
            -webkit-font-smoothing: antialiased;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Diagnostic Error Overlay */
        #diagnostic-error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 10000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            font-family: monospace;
            text-align: left;
        }

        #diagnostic-error-overlay h1 { color: #ef4444; margin-bottom: 20px; }
        #diagnostic-error-overlay pre {
            background: #1e293b;
            color: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            max-width: 100%;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 13px;
        }

        *:not(input):not(textarea):not([contenteditable="true"]) {
            caret-color: transparent !important;
        }

        input, textarea, [contenteditable="true"] {
            caret-color: auto !important;
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        /* Ocultar flechas negras en inputs numéricos */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .selectable, td, p, span, h1, h2, h3, h4, h5, h6 {
            user-select: text;
            -webkit-user-select: text;
        }

        *:focus:not(:focus-visible) {
            outline: none !important;
            box-shadow: none !important;
        }

        *:focus-visible {
            outline: 2px solid #2563eb !important;
            outline-offset: 2px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #root:empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: white;
            padding: 20px;
            text-align: center;
        }
        #loading-error {
            display: none;
            color: #ef4444;
            font-size: 14px;
            margin-top: 20px;
            max-width: 300px;
        }
        #reload-btn {
            display: none;
            margin-top: 20px;
            padding: 10px 20px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

    <script>
        // Protección contra errores de asignación en window.fetch (común en entornos de iframe/AI Studio)
        (function() {
            try {
                const originalFetch = window.fetch;
                Object.defineProperty(window, 'fetch', {
                    get: function() { return originalFetch; },
                    set: function() { 
                        console.warn('⚠️ Intento de sobrescribir window.fetch bloqueado para evitar errores de "solo lectura".');
                    },
                    configurable: true
                });
            } catch (e) {
                // Ya es inmutable o no se puede redefinir, lo cual es el estado deseado
            }
        })();

        // Capturar errores tempranos
        window.onerror = function(msg, url, line, col, error) {
            console.error("Error crítico detectado:", msg, "en", url, ":", line);
            var errorDiv = document.getElementById('loading-error');
            if (errorDiv) {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = "<strong>Error de carga:</strong><br>" + msg + "<br><small>" + url + ":" + line + "</small>";
            }
            var reloadBtn = document.getElementById('reload-btn');
            if (reloadBtn) reloadBtn.style.display = 'block';
            var clearBtn = document.getElementById('clear-cache-btn');
            if (clearBtn) clearBtn.style.display = 'block';
            return false;
        };

        // Función para limpiar todo y recargar silenciosamente
        function clearAndReload() {
            try {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        }
                    }).catch(function() {});
                }
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        for (let name of names) caches.delete(name);
                    }).catch(function() {});
                }
            } catch (e) {}
            window.location.reload(true);
        }

        // Auto-recuperación silenciosa ante errores de carga de script/módulo
        function autoRecoverFromChunkError() {
            var reloadCount = parseInt(sessionStorage.getItem('chunk_reload_count') || '0', 10);
            if (reloadCount < 2) {
                sessionStorage.setItem('chunk_reload_count', String(reloadCount + 1));
                console.warn('⚡ [AutoHeal] Restableciendo caché por actualización de la app...');
                clearAndReload();
            } else {
                console.warn('⚠️ [AutoHeal] Límite de reintentos alcanzado.');
                sessionStorage.removeItem('chunk_reload_count');
                var splash = document.getElementById('startup-splash');
                if (splash) splash.remove();
            }
        }

        // Capturar errores de carga de JS/Módulos
        window.addEventListener('error', function(e) {
            var msg = (e && e.message) ? String(e.message) : '';
            var target = e && e.target;
            var isScriptTag = target && (target.tagName === 'SCRIPT');
            // Solo activar AutoHeal si es un error genuino de descarga de chunk/módulo
            if (
                msg.includes('Loading chunk') ||
                msg.includes('Failed to fetch') ||
                msg.includes('dynamically imported module') ||
                msg.includes('Importing a module script failed') ||
                (isScriptTag && !msg && !e.error)
            ) {
                autoRecoverFromChunkError();
            }
        }, true);

        // Capturar rechazos no manejados de promesas (imports dinámicos de Vite)
        window.onunhandledrejection = function(e) {
            var reason = e ? (e.reason || e) : null;
            var msg = reason ? (reason.message || String(reason)) : '';
            if (
                msg.includes('Loading chunk') ||
                msg.includes('Failed to fetch') ||
                msg.includes('dynamically imported module') ||
                msg.includes('Importing a module script failed')
            ) {
                autoRecoverFromChunkError();
            }
        };

        // Timeout de seguridad de 4s: Remueve el splash automáticamente sin mostrar banderas rojas de error
        setTimeout(function() {
            var splash = document.getElementById('startup-splash');
            if (splash) {
                splash.style.opacity = '0';
                splash.style.transition = 'opacity 0.3s ease';
                setTimeout(function() { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 300);
            }
        }, 4000);
    </script>
</head>
<body class="text-slate-900">
    <div id="startup-splash" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 99999; background: #f8fafc;">
        <style>
            @keyframes spin { 100% { transform: rotate(360deg); } }
            .spinner { width: 48px; height: 48px; border: 3px solid #1e3a8a; border-bottom-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        </style>
        <div class="spinner"></div>
        <p style="color: #64748b; font-weight: bold; font-family: sans-serif;">Cargando interfaz...</p>
    </div>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
