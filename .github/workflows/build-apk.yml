name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform & Sync Capacitor
        run: npx cap add android || npx cap sync android

      - name: Prepare Android Icons and Splash
        run: |
          mkdir -p assets

          # Ensure ImageMagick is available on the runner.
          if ! command -v magick >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          # The original PNG contains a large white canvas around the logo.
          # Trim that canvas first so the logo can be scaled independently.
          magick public/icon-512x512.png -trim +repage /tmp/tentelcom-logo-trimmed.png

          # Android adaptive/launcher icon:
          # transparent canvas + centered logo, with enough safe area to avoid
          # the previous oversized/clipped appearance.
          magick /tmp/tentelcom-logo-trimmed.png \
            -resize 62% \
            -gravity center \
            -background none \
            -extent 1024x1024 \
            assets/icon-only.png

          # Foreground layer uses the same transparent logo.
          cp assets/icon-only.png assets/icon-foreground.png

          # White icon background keeps the launcher icon clean without the
          # visible white square that was present in the previous splash.
          magick -size 1024x1024 canvas:white assets/icon-background.png

          # Full splash for Android versions that support the custom splash
          # image: white canvas with the trimmed logo substantially larger,
          # matching the visual composition of the PWA screenshot.
          magick /tmp/tentelcom-logo-trimmed.png \
            -resize 1600x1600 \
            -gravity center \
            -background white \
            -extent 2732x2732 \
            assets/splash.png

          # Generate Android resources using Full Control mode.
          npx -y @capacitor/assets generate \
            --android \
            --assetPath assets \
            --splashBackgroundColor "#ffffff"

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tentelcom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentelcom-apk
          path: android/app/build/outputs/apk/debug/Tentelcom.apk
          retention-days: 14
