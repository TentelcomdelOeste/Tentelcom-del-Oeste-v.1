name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform & Sync Capacitor
        run: npx cap add android || npx cap sync android

      - name: Prepare Android Icons and Splash
        run: |
          mkdir -p assets

          # Ensure ImageMagick is available on the runner.
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          # GitHub Ubuntu currently provides ImageMagick through the "convert"
          # command. Use that command explicitly for compatibility.
          # The original PNG contains a large white canvas around the logo.
          # Trim that canvas first so the logo can be scaled independently.
          convert public/icon-512x512.png -trim +repage /tmp/tentelcom-logo-trimmed.png

          # Android adaptive/launcher icon:
          # transparent canvas + centered logo, with enough safe area to avoid
          # the previous oversized/clipped appearance.
          convert /tmp/tentelcom-logo-trimmed.png \
            -resize 75% \
            -gravity center \
            -background none \
            -extent 1024x1024 \
            assets/icon-only.png

          # Foreground layer uses the same enlarged transparent logo.
          cp assets/icon-only.png assets/icon-foreground.png

          # Keep the launcher adaptive background white. Android/One UI controls
          # the outer icon shape, but the artwork itself is now substantially larger.
          convert -size 1024x1024 canvas:white assets/icon-background.png

          # Splash artwork: transparent logo only. Android 12+ will place this
          # artwork over the splash background instead of showing the launcher
          # icon's white rounded-square container.
          convert /tmp/tentelcom-logo-trimmed.png \
            -resize 75% \
            -gravity center \
            -background none \
            -extent 1024x1024 \
            assets/splash-icon.png

          # Full splash fallback for Android 11 and below.
          convert /tmp/tentelcom-logo-trimmed.png \
            -resize 1600x1600 \
            -gravity center \
            -background white \
            -extent 2732x2732 \
            assets/splash.png
          cp assets/splash.png assets/splash-dark.png

          # Generate the native resources.
          npx -y @capacitor/assets generate \
            --android \
            --assetPath assets \
            --splashBackgroundColor "#ffffff" \
            --splashBackgroundColorDark "#ffffff"

          # Android 12+ does not use the full-screen splash.png. It uses the
          # system SplashScreen API, which must be configured explicitly.
          # Force a white background in both light and dark mode and use the
          # transparent logo artwork as the centered splash icon.
          mkdir -p android/app/src/main/res/drawable
          cp assets/splash-icon.png android/app/src/main/res/drawable/splash_icon.png

          python3 - <<'PY'
          from pathlib import Path
          import re

          styles = Path("android/app/src/main/res/values/styles.xml")
          text = styles.read_text()

          replacement = r'''\1
                  <item name="windowSplashScreenBackground">#ffffff</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
                  <item name="windowSplashScreenIconBackgroundColor">@android:color/transparent</item>'''

          pattern = r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)'
          new_text, count = re.subn(
              pattern,
              lambda m: m.group(1) + replacement.replace(r"\1", "") + m.group(2) + m.group(3),
              text,
              count=1,
              flags=re.S
          )

          if count != 1:
              raise SystemExit("Could not locate AppTheme.NoActionBarLaunch in styles.xml")

          styles.write_text(new_text)

          night_dir = Path("android/app/src/main/res/values-night")
          night_dir.mkdir(parents=True, exist_ok=True)
          night = night_dir / "styles.xml"
          if night.exists():
              nt = night.read_text()
              if "AppTheme.NoActionBarLaunch" in nt:
                  nt, _ = re.subn(
                      pattern,
                      lambda m: m.group(1) +
                                '\n        <item name="windowSplashScreenBackground">#ffffff</item>' +
                                '\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>' +
                                '\n        <item name="android:windowSplashScreenIconBackgroundColor">@android:color/transparent</item>' +
                                '\n        <item name="android:windowSplashScreenBackground">#ffffff</item>' +
                                m.group(2) + m.group(3),
                      nt, count=1, flags=re.S
                  )
                  night.write_text(nt)
          else:
              night.write_text('''<resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#ffffff</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
                  <item name="windowSplashScreenIconBackgroundColor">@android:color/transparent</item>
              </style>
          </resources>
          ''')
          PY

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tentelcom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentelcom-apk
          path: android/app/build/outputs/apk/debug/Tentelcom.apk
          retention-days: 14
