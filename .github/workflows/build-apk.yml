name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform & Sync Capacitor
        run: npx cap add android || npx cap sync android

      - name: Prepare Android Icons and Splash
        run: |
          mkdir -p assets

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          # ============================================================
          # TENTELCOM LAUNCHER ICON
          # Same architecture used by Field Trace:
          # - legacy density icons
          # - transparent adaptive foreground
          # - solid adaptive background
          # - explicit adaptive-icon XML
          # ============================================================
          # Use the stored 512x512 artwork directly, exactly like Field Trace.
          # Do NOT trim or otherwise crop the source image before scaling.
          cp public/icon-512x512.png /tmp/tentelcom-source.png

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values

          # Legacy launcher icons use the same stored source artwork, matching Field Trace.
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            convert -size "${size}x${size}" canvas:white "/tmp/icon-${density}.png"
            convert /tmp/tentelcom-source.png \
              -resize 72% \
              -gravity center \
              -background white \
              -extent "${size}x${size}" "/tmp/icon-${density}.png"
            cp "/tmp/icon-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "/tmp/icon-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          # Adaptive foreground: transparent artwork only.
          # Exact Field Trace geometry:
          # mdpi 108x108 canvas / 70x70 artwork
          # hdpi 162x162 canvas / 82x82 artwork
          # xhdpi 216x216 canvas / 101x101 artwork
          # xxhdpi 324x324 canvas / 210x210 artwork
          # xxxhdpi 432x432 canvas / 280x280 artwork
          convert /tmp/tentelcom-source.png \
            -resize 70x70 \
            -gravity center \
            -background none \
            -extent 108x108 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png

          convert /tmp/tentelcom-source.png \
            -resize 82x82 \
            -gravity center \
            -background none \
            -extent 162x162 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png

          convert /tmp/tentelcom-source.png \
            -resize 101x101 \
            -gravity center \
            -background none \
            -extent 216x216 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png

          convert /tmp/tentelcom-source.png \
            -resize 210x210 \
            -gravity center \
            -background none \
            -extent 324x324 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png

          convert /tmp/tentelcom-source.png \
            -resize 280x280 \
            -gravity center \
            -background none \
            -extent 432x432 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # ============================================================
          # ANDROIDX SPLASH + NATIVE OVERLAY
          # The system splash uses a transparent 1dp icon so Android does
          # not apply its launcher-icon mask. MainActivity then draws the
          # real Tentelcom splash image as a normal full-content overlay.
          # ============================================================
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values-night

          convert /tmp/tentelcom-source.png \
            -resize 66% \
            -gravity center \
            -background white \
            -extent 512x512 \
            android/app/src/main/res/drawable/splash_icon.png

          cat > android/app/src/main/res/drawable/splash_system_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1dp"
              android:height="1dp"
              android:viewportWidth="1"
              android:viewportHeight="1">
              <path
                  android:fillColor="#00000000"
                  android:pathData="M0,0" />
          </vector>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Ensure the AndroidX SplashScreen dependency exists.
          gradle = Path("android/app/build.gradle")
          gt = gradle.read_text()
          if "androidx.core:core-splashscreen" not in gt:
              match = re.search(r"(dependencies\s*\{)", gt)
              if not match:
                  raise SystemExit("Could not locate dependencies block in app/build.gradle")
              gt = gt[:match.end()] + '\n    implementation "androidx.core:core-splashscreen:1.2.0"' + gt[match.end():]
              gradle.write_text(gt)

          # Configure the generated launch theme exactly once.
          for path in [
              Path("android/app/src/main/res/values/styles.xml"),
              Path("android/app/src/main/res/values-v31/styles.xml"),
              Path("android/app/src/main/res/values-night/styles.xml"),
          ]:
              if not path.exists():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text("<resources>\n</resources>\n")

              text = path.read_text()
              block = '''<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#FFFFFF</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_system_icon</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>'''

              pattern = r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>'
              if re.search(pattern, text, flags=re.S):
                  text = re.sub(pattern, block, text, count=1, flags=re.S)
              else:
                  text = text.replace("</resources>", f"    {block}\n</resources>")
              path.write_text(text)

          # Force MainActivity to use the launch theme.
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          mt = manifest.read_text()

          activity_pattern = r'<activity\b(?=[^>]*android:name="\.MainActivity")[^>]*>'
          match = re.search(activity_pattern, mt, flags=re.S)
          if not match:
              raise SystemExit("Could not locate .MainActivity in AndroidManifest.xml")

          activity = match.group(0)
          if re.search(r'android:theme="[^"]*"', activity):
              activity = re.sub(
                  r'android:theme="[^"]*"',
                  'android:theme="@style/AppTheme.NoActionBarLaunch"',
                  activity,
                  count=1
              )
          else:
              activity = activity[:-1] + '\n            android:theme="@style/AppTheme.NoActionBarLaunch">'
          mt = mt[:match.start()] + activity + mt[match.end():]
          manifest.write_text(mt)

          # MainActivity follows Field Trace's native overlay pattern.
          main = Path("android/app/src/main/java/com/tentelcom/portal/MainActivity.java")
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text(r'''package com.tentelcom.portal;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          import androidx.core.splashscreen.SplashScreen;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  SplashScreen.installSplashScreen(this);
                  super.onCreate(savedInstanceState);
                  showTentelcomLaunchSplash();
              }

              private void showTentelcomLaunchSplash() {
                  final FrameLayout root = findViewById(android.R.id.content);
                  if (root == null) return;

                  final FrameLayout overlay = new FrameLayout(this);
                  overlay.setBackgroundColor(Color.WHITE);
                  overlay.setAlpha(1f);

                  final ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.splash_icon);
                  logo.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                  logo.setAdjustViewBounds(false);

                  overlay.addView(
                      logo,
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  );

                  root.addView(
                      overlay,
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  );

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      overlay.animate()
                          .alpha(0f)
                          .setDuration(140L)
                          .withEndAction(() -> root.removeView(overlay))
                          .start();
                  }, 650L);
              }
          }
          ''')

          print("Android branding prepared: adaptive launcher icon + AndroidX system splash + native overlay.")
          PY

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tentelcom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentelcom-apk
          path: android/app/build/outputs/apk/debug/Tentelcom.apk
          retention-days: 14
