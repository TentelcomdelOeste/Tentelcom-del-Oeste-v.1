name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform & Sync Capacitor
        run: npx cap add android || npx cap sync android

      - name: Generate Android Icons and Splash
        run: |
          mkdir -p assets
          # Padded source: keeps the existing Tentelcom logo but gives Android
          # enough safe area so the launcher icon is not visually oversized.
          convert public/icon-512x512.png -resize 72% -gravity center -background white -extent 1024x1024 assets/icon.png
          # White splash background makes the logo's existing white canvas
          # visually disappear instead of appearing as a separate frame.
          npx -y @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#ffffff" --splashBackgroundColor "#ffffff" --logoSplashScale 0.15

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tentelcom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentelcom-apk
          path: android/app/build/outputs/apk/debug/Tentelcom.apk
          retention-days: 14
