name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform & Sync Capacitor
        run: npx cap add android || npx cap sync android

      - name: Configure Firebase Android
        run: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json

      - name: Prepare Android Icons and Splash
        run: |
          mkdir -p assets

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          # ============================================================
          # TENTELCOM LAUNCHER ICON
          # Same architecture used by Field Trace:
          # - legacy density icons
          # - transparent adaptive foreground
          # - solid adaptive background
          # - explicit adaptive-icon XML
          # ============================================================
          # Use the stored 512x512 artwork directly, exactly like Field Trace.
          # Do NOT trim or otherwise crop the source image before scaling.
          cp public/icon-512x512.png /tmp/tentelcom-source.png

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values

          # Legacy launcher icons use the same stored source artwork, matching Field Trace.
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            convert -size "${size}x${size}" canvas:white "/tmp/icon-${density}.png"
            convert /tmp/tentelcom-source.png \
              -resize 72% \
              -gravity center \
              -background white \
              -extent "${size}x${size}" "/tmp/icon-${density}.png"
            cp "/tmp/icon-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "/tmp/icon-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          # Adaptive foreground: transparent artwork only.
          # Exact Field Trace geometry:
          # mdpi 108x108 canvas / 65x65 artwork
          # hdpi 162x162 canvas / 98x98 artwork
          # xhdpi 216x216 canvas / 130x130 artwork
          # xxhdpi 324x324 canvas / 195x195 artwork
          # xxxhdpi 432x432 canvas / 260x260 artwork
          convert /tmp/tentelcom-source.png \
            -resize 65x65 \
            -gravity center \
            -background none \
            -extent 108x108 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png

          convert /tmp/tentelcom-source.png \
            -resize 98x98 \
            -gravity center \
            -background none \
            -extent 162x162 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png

          convert /tmp/tentelcom-source.png \
            -resize 130x130 \
            -gravity center \
            -background none \
            -extent 216x216 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png

          convert /tmp/tentelcom-source.png \
            -resize 195x195 \
            -gravity center \
            -background none \
            -extent 324x324 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png

          convert /tmp/tentelcom-source.png \
            -resize 260x260 \
            -gravity center \
            -background none \
            -extent 432x432 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # ============================================================
          # ANDROIDX SPLASH + NATIVE OVERLAY
          # The system splash uses a transparent 1dp icon so Android does
          # not apply its launcher-icon mask. MainActivity then draws the
          # real Tentelcom splash image as a normal full-content overlay.
          # ============================================================
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values-night

          # High-resolution splash source uploaded separately from the launcher icon.
          # Preserve its aspect ratio and fit the visible artwork to the same 338px
          # geometry used by Field Trace (66% of a 512x512 canvas).
          convert public/tentelcom-splash-source.png \
            -resize 338x338 \
            -gravity center \
            -background white \
            -extent 512x512 \
            android/app/src/main/res/drawable/splash_icon.png

          cat > android/app/src/main/res/drawable/splash_system_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1dp"
              android:height="1dp"
              android:viewportWidth="1"
              android:viewportHeight="1">
              <path
                  android:fillColor="#00000000"
                  android:pathData="M0,0" />
          </vector>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Ensure the AndroidX SplashScreen dependency exists.
          gradle = Path("android/app/build.gradle")
          gt = gradle.read_text()
          if "androidx.core:core-splashscreen" not in gt:
              match = re.search(r"(dependencies\s*\{)", gt)
              if not match:
                  raise SystemExit("Could not locate dependencies block in app/build.gradle")
              gt = gt[:match.end()] + '\n    implementation "androidx.core:core-splashscreen:1.2.0"' + gt[match.end():]
              gradle.write_text(gt)

          # Configure the generated launch theme exactly once.
          for path in [
              Path("android/app/src/main/res/values/styles.xml"),
              Path("android/app/src/main/res/values-v31/styles.xml"),
              Path("android/app/src/main/res/values-night/styles.xml"),
          ]:
              if not path.exists():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text("<resources>\n</resources>\n")

              text = path.read_text()
              block = '''<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#FFFFFF</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_system_icon</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>'''

              pattern = r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>'
              if re.search(pattern, text, flags=re.S):
                  text = re.sub(pattern, block, text, count=1, flags=re.S)
              else:
                  text = text.replace("</resources>", f"    {block}\n</resources>")
              path.write_text(text)

          # Force MainActivity to use the launch theme.
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          mt = manifest.read_text()

          activity_pattern = r'<activity\b(?=[^>]*android:name="\.MainActivity")[^>]*>'
          match = re.search(activity_pattern, mt, flags=re.S)
          if not match:
              raise SystemExit("Could not locate .MainActivity in AndroidManifest.xml")

          activity = match.group(0)
          if re.search(r'android:theme="[^"]*"', activity):
              activity = re.sub(
                  r'android:theme="[^"]*"',
                  'android:theme="@style/AppTheme.NoActionBarLaunch"',
                  activity,
                  count=1
              )
          else:
              activity = activity[:-1] + '\n            android:theme="@style/AppTheme.NoActionBarLaunch">'
          mt = mt[:match.start()] + activity + mt[match.end():]
          manifest.write_text(mt)

          # MainActivity follows Field Trace's native overlay pattern.
          main = Path("android/app/src/main/java/com/tentelcom/portal/MainActivity.java")
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text(r'''package com.tentelcom.portal;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          import androidx.core.splashscreen.SplashScreen;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  SplashScreen.installSplashScreen(this);
                  super.onCreate(savedInstanceState);
                  showTentelcomLaunchSplash();
              }

              private void showTentelcomLaunchSplash() {
                  final FrameLayout root = findViewById(android.R.id.content);
                  if (root == null) return;

                  final FrameLayout overlay = new FrameLayout(this);
                  overlay.setBackgroundColor(Color.WHITE);
                  overlay.setAlpha(1f);

                  final ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.splash_icon);
                  logo.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                  logo.setAdjustViewBounds(false);

                  overlay.addView(
                      logo,
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  );

                  root.addView(
                      overlay,
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  );

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      overlay.animate()
                          .alpha(0f)
                          .setDuration(140L)
                          .withEndAction(() -> root.removeView(overlay))
                          .start();
                  }, 650L);
              }
          }
          ''')

          print("Android branding prepared: adaptive launcher icon + AndroidX system splash + native overlay.")
          PY

      - name: Set Monotonic Android Version Code
        run: |
          # Every new workflow run receives a higher versionCode so Android
          # recognizes the APK as an update rather than an older/equal build.
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          python3 - "$VERSION_CODE" <<'PY'
          from pathlib import Path
          import re
          import sys
          version_code = int(sys.argv[1])
          path = Path("android/app/build.gradle")
          text = path.read_text()
          pattern = r'(defaultConfig\s*\{)'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + f'\n        versionCode {version_code}',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not locate Android defaultConfig in android/app/build.gradle")
          path.write_text(updated)
          print(f"Android versionCode set to {version_code}")
          PY

      - name: Validate Android Build Configuration
        working-directory: android
        run: |
          echo "=== Generated Android build configuration ==="
          grep -n -A8 -B2 "defaultConfig" app/build.gradle
          echo "=== Validate versionCode syntax ==="
          grep -Eq '^\s*versionCode\s+[0-9]+\s*$' app/build.gradle
          if grep -Fq '\n        versionCode' app/build.gradle; then
            echo "ERROR: literal \n sequence detected in app/build.gradle"
            exit 1
          fi
          echo "=== Validate Gradle script compilation ==="
          ./gradlew help --stacktrace --no-daemon

      - name: Restore Stable Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tentelcom-debug-keystore-v1

      - name: Configure Stable Debug Signing
        run: |
          # Keep one signing certificate across GitHub-hosted runners.
          # The first successful build creates it; subsequent builds restore it
          # from the GitHub Actions cache.
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -v | grep "SHA256:"

      - name: Build Debug APK with Gradle
        id: gradle_build
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace --info --no-daemon 2>&1 | tee ../gradle-build.log
          gradle_status="${PIPESTATUS[0]}"
          echo "Gradle exit code: ${gradle_status}" | tee -a ../gradle-build.log
          exit "${gradle_status}"

      - name: Upload Gradle Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tentelcom-gradle-diagnostic
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Gradle build failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Validate APK Artifact
        if: steps.gradle_build.outcome == 'success'
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          SDK_BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          keytool -printcert -jarfile "$APK" | grep -E "Owner:|SHA256:"

      - name: Prepare APK Artifact
        if: steps.gradle_build.outcome == 'success'
        working-directory: android
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tentelcom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentelcom-apk
          path: android/app/build/outputs/apk/debug/Tentelcom.apk
          retention-days: 14
 app/build.gradle
          if grep -Fq '\\n        versionCode' app/build.gradle; then
            echo "ERROR: literal \\n sequence detected in app/build.gradle"
            exit 1
          fi
          echo "=== Validate Gradle script compilation ==="
          ./gradlew help --stacktrace --no-daemon

      - name: Restore Stable Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tentelcom-debug-keystore-v1

      - name: Configure Stable Debug Signing
        run: |
          # Keep one signing certificate across GitHub-hosted runners.
          # The first successful build creates it; subsequent builds restore it
          # from the GitHub Actions cache.
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -v | grep "SHA256:"

      - name: Build Debug APK with Gradle
        id: gradle_build
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee ../gradle-build.log
          exit "${PIPESTATUS[0]}"

      - name: Upload Gradle Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tentelcom-gradle-diagnostic
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Gradle build failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Prepare APK Artifact
        if: steps.gradle_build.outcome == 'success'
        working-directory: android
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tentelcom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentelcom-apk
          path: android/app/build/outputs/apk/debug/Tentelcom.apk
          retention-days: 14
